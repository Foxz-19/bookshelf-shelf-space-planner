<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1c3028"><title>Verdant — Plant care ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="#plants" aria-label="Verdant home"><span class="brand-mark">✦</span>Verdant</a><p id="today" class="today"></p><button id="theme-toggle" class="text-button" type="button" aria-pressed="false">Night view</button></header>
  <main>
    <aside class="composer" aria-labelledby="add-heading"><div class="composer-inner">
      <p class="eyebrow">Collection</p><h1 id="add-heading">Keep every<br><em>leaf</em> in rhythm.</h1><p class="intro">A small care ledger for the plants sharing your space.</p>
      <form id="plant-form" novalidate>
        <div class="field"><label for="plant-name">Plant name <b>*</b></label><input id="plant-name" name="name" maxlength="60" autocomplete="off" required placeholder="e.g. Monstera deliciosa"></div>
        <div class="field"><label for="nickname">Nickname <span>optional</span></label><input id="nickname" name="nickname" maxlength="40" autocomplete="off" placeholder="e.g. The big one"></div>
        <div class="field"><label for="frequency">Water every <b>*</b></label><div class="stepper"><input id="frequency" name="frequency" type="number" min="1" max="365" value="7" required><span>days</span></div></div>
        <div class="field"><label for="last-watered">Last watered <span>optional · defaults to today</span></label><input id="last-watered" name="lastWatered" type="date"></div>
        <div class="field"><label for="note">Care note <span>optional</span></label><textarea id="note" name="note" maxlength="140" rows="3" placeholder="Needs distilled water"></textarea><small><output id="note-count">0</output>/140</small></div>
        <p id="form-error" class="form-error" role="alert" hidden></p><div class="form-actions"><button id="submit-button" class="primary-button" type="submit">Add to collection <span>↗</span></button><button id="edit-cancel" class="text-button" type="button" hidden>Cancel edit</button></div>
      </form>
      <p class="storage-note">Saved privately in this browser.</p>
    </div></aside>
    <section class="workspace" id="plants" aria-labelledby="plants-heading">
      <div class="workspace-head"><div><p class="eyebrow">Care schedule</p><h2 id="plants-heading">Your plants</h2></div><div id="summary" class="summary" aria-live="polite"></div></div>
      <div class="legend" aria-label="Watering status legend"><span><i class="dot urgent"></i>Overdue</span><span><i class="dot today-dot"></i>Today</span><span><i class="dot soon"></i>Upcoming</span></div>
      <div id="plant-list" class="plant-list" aria-live="polite" aria-busy="true"><p class="loading">Loading your care schedule…</p></div>
    </section>
  </main>
  <dialog id="delete-dialog" aria-labelledby="delete-title"><form method="dialog"><p class="eyebrow">Remove plant</p><h2 id="delete-title">Remove this plant?</h2><p id="delete-copy"></p><div class="dialog-actions"><button value="cancel" class="text-button">Keep it</button><button value="confirm" class="danger-button">Remove plant</button></div></form></dialog>
  <section id="notices" class="notices" aria-label="Activity and alerts" aria-live="polite"></section>
  <script type="module" src="js/app.js"></script>
</body></html>
